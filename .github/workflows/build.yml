name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 编译并打包「未签名 IPA」。
      # 说明：archive 动作要求 -scheme，这里改用 build + 手动打包，避免依赖共享 scheme；
      # 免费 Apple ID 无法在 CI 签出可安装 IPA，此处产物用于验证构建，
      # 以及供你在本地用免费账号（Xcode / AltStore / Sideloadly）重新签名后安装。
      - name: Build unsigned IPA (arm64)
        run: |
          set -euo pipefail
          xcodebuild \
            -project GitHubStars/GitHubStars.xcodeproj \
            -target GitHubStars \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            build

          APP_PATH="$PWD/build/Release-iphoneos/GitHubStars.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: 未找到构建产物 $APP_PATH"; exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r GitHubStars.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHubStars-unsigned-ipa
          path: build/ipa/GitHubStars.ipa
          if-no-files-found: error
